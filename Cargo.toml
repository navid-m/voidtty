[package]
name = "voidtty"
version = "0.0.3"
edition = "2024"
authors = ["Navid Momtahen"]

[[bin]]
name = "voidtty"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
fontdb = "0.23"
fontdue = "0.9"
gl = "0.14"
glfw = "0.58"
png = "0.17"
portable-pty = "0.8"
rustybuzz = "0.20.1"
unicode-width = "0.2"
vte = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
