[package]
name = "godtty"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "godtty"
path = "src/main.rs"

[dependencies]
anyhow = "1"
fontdb = "0.23"
fontdue = "0.9"
gl = "0.14"
glfw = "0.58"
portable-pty = "0.8"
vte = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
